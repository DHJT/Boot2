syntax = "proto3";
option java_multiple_files = true;
option java_package = "tech.dhjt.boot.grpc.server.proto";
option java_outer_classname = "UserProto";

package user;

import "buf/validate/validate.proto";

// 用户信息服务 - 展示多参数 gRPC 方法
service UserService {
    // 多参数创建用户
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
    // 多参数查询用户
    rpc GetUser (GetUserRequest) returns (GetUserResponse);
  // 服务端流式：列出所有用户
    rpc ListUsers (ListUsersRequest) returns (stream UserInfo);
}

// ============ 通用消息 ============

// 用户信息
message UserInfo {
    int64 id = 1;
    string username = 2 [(buf.validate.field).string.min_len = 2, (buf.validate.field).string.max_len = 32];
    string email = 3 [(buf.validate.field).string.email = true];
    int32 age = 4 [(buf.validate.field).int32.gte = 1, (buf.validate.field).int32.lte = 200];
    string phone = 5 [(buf.validate.field).string.min_len = 5, (buf.validate.field).string.max_len = 20];
    string created_at = 6;
    string updated_at = 7;
}

// ============ 创建用户 (多参数) ============
message CreateUserRequest {
    string username = 1 [(buf.validate.field).string.min_len = 2, (buf.validate.field).string.max_len = 32];
    string email = 2 [(buf.validate.field).string.email = true];
    int32 age = 3 [(buf.validate.field).int32.gte = 1, (buf.validate.field).int32.lte = 200];
    string phone = 4 [(buf.validate.field).string.min_len = 5, (buf.validate.field).string.max_len = 20];
    string password = 5 [(buf.validate.field).string.min_len = 6, (buf.validate.field).string.max_len = 128];
    string nickname = 6 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 32];
}

message CreateUserResponse {
    bool success = 1;
    string message = 2;
    int64 user_id = 3;
}

// ============ 查询用户 ============

message GetUserRequest {
    int64 user_id = 1 [(buf.validate.field).int64.gte = 1];
}

message ListUsersRequest {
    int32 page_size = 1 [(buf.validate.field).int32.gte = 1, (buf.validate.field).int32.lte = 1000];
    string page_token = 2;
}

message GetUserResponse {
    bool success = 1;
    string message = 2;
    UserInfo user = 3;
}