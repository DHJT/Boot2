syntax = "proto3";
option java_multiple_files = true;
option java_package = "tech.dhjt.boot.grpc.server.proto";
option java_outer_classname = "UserProto";

package user;

// 用户信息服务 - 展示多参数 gRPC 方法
service UserService {
    // 多参数创建用户
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
    // 多参数查询用户
    rpc GetUser (GetUserRequest) returns (GetUserResponse);
  // 服务端流式：列出所有用户
    rpc ListUsers (ListUsersRequest) returns (stream UserInfo);
}

// ============ 通用消息 ============

// 用户信息
message UserInfo {
    int64 id = 1;
    string username = 2;
    string email =3;
    int32 age = 4;
    string phone = 5;
    string created_at = 6;
    string updated_at = 7;
}

// ============ 创建用户 (多参数) ============
message CreateUserRequest {
    string username = 1;
    string email = 2;
    int32 age =3;
    string phone = 4;
    string password = 5;
    string nickname = 6;
}

message CreateUserResponse {
    bool success = 1;
    string message = 2;
    int64 user_id =3;
}

// ============ 查询用户 ============

message GetUserRequest {
    int64 user_id = 1;
}

message ListUsersRequest {
    int32 page_size = 1;
    string page_token = 2;
}

message GetUserResponse {
    bool success = 1;
    string message = 2;
    UserInfo user = 3;
}