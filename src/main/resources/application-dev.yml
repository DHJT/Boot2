server:
  port: 8080
  http2:
    enabled: true
  servlet:
#    path: /
    session:
      timeout: 10
  tomcat:
    uri-encoding: UTF-8
spring:
  application:
    name: boot2
  Jackson:
    time-zone: Asia/Shanghai
  datasource:
#    url: jdbc:h2:file:~/flowable_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE # 文件持久化； jdbc:h2:mem:testdb 内存数据库，名称为 testdb。
    url: jdbc:h2:file:./flowable_db;DB_CLOSE_DELAY=-1;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update    # 自动建表，开发常用
    show-sql: true                # 打印 SQL，便于调试
  h2:
    console:
      enabled: true
      path: /h2-console     # 访问路径

#entitymanager.packagesToScan:
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: tech.dhjt.boot3.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
  
#启用shutdown
#禁用密码验证endpoints.shutdown.sensitive=false
management:
#  server:
#    servlet:
#      context-path: /manager
#    address:
#    port: 8012
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
        - "*"
  metrics:
    tags:
      application: ${spring.application.name}

# Flowable 工作流引擎配置
flowable:
  # 自动部署流程定义（扫描 classpath:processes/）
  async-executor-activate: false
  database-schema-update: true
  # 关闭自动部署，我们手动触发一次以确保最新
  check-process-definitions: true
  process-definition-location-prefix: classpath:/processes/
