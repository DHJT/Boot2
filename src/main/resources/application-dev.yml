server:
  port: 8080
  tomcat.threads.virtual.enabled: true
# 全局启用虚拟线程
spring:
  threads:
    virtual:
      enabled: true
management:
  endpoint:
    health:
      access: unrestricted
    shutdown:
      access: unrestricted
  endpoints:
    migrate-legacy-ids: true
    web:
      exposure:
        include: "*" # health,env,configprops,info,metrics
  